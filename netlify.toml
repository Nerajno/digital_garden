# Netlify builds and hosts the site; GitHub Actions only checks the build.
# Ruby comes from .ruby-version — keep it accurate.

[build]
  command = "bundle exec jekyll build"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"

# Site-wide security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Asset filenames aren't fingerprinted. CSS/JS revalidate on every load
# (cheap 304s; Netlify swaps its CDN cache on each deploy), so a deploy never
# serves stale styles. Images rarely change, so they keep a week.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
